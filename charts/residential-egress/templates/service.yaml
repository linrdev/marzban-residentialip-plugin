apiVersion: v1
kind: Service
metadata:
  name: {{ include "resip.name" . }}
  labels:
    {{- include "resip.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "resip.selector" . | nindent 4 }}
  ports:
    - name: http
      port: 8787
      targetPort: http
{{- if .Values.marzban.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "resip.name" . }}-marzban
  labels:
    {{- include "resip.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "resip.selector" . | nindent 4 }}
  ports:
    - name: panel
      port: 8000
      targetPort: panel
    - name: vless
      port: 1080
      targetPort: vless
{{- end }}
