{{- if not .Values.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "resip.name" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "resip.labels" . | nindent 4 }}
spec:
  accessModes: [{{ .Values.persistence.accessMode | quote }}]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
{{- if and .Values.marzban.enabled (not .Values.marzban.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "resip.marzbanClaim" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "resip.labels" . | nindent 4 }}
spec:
  accessModes: [{{ .Values.persistence.accessMode | quote }}]
  {{- if .Values.marzban.persistence.storageClass }}
  storageClassName: {{ .Values.marzban.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.marzban.persistence.size | quote }}
{{- end }}
