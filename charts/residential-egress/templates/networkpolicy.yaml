{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "resip.name" . }}
  labels:
    {{- include "resip.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "resip.selector" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if ne .Values.networkPolicy.egress nil }}
    - Egress
    {{- end }}
  ingress:
    - from:
        - podSelector:
            matchLabels:
              resip-access: "true"
      ports:
        - {protocol: TCP, port: 8787}
    {{- with .Values.networkPolicy.additionalIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if ne .Values.networkPolicy.egress nil }}
  egress: {{ .Values.networkPolicy.egress | toJson }}
  {{- end }}
{{- end }}
